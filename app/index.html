<!DOCTYPE html>
<!--
  Career dashboard. Ships without data: it loads /payload.json from the same
  origin. Source of truth is the Obsidian Career vault; see CLAUDE.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career dashboard</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-soft: #f9f9fb;
    --text: #1d1d1f;
    --text-soft: #6e6e73;
    --text-faint: #a1a1a6;
    --accent: #5b6cff;
    --accent-soft: #eef0ff;
    --track: #eceef1;
    --green: #34c759;
    --red: #ff6b5b;
    --warn: #ff9f0a;
    --warn-soft: #fff3e0;
    --warn-strong: #b8720a;
    --green-soft: #e6f7ea;
    --green-strong: #1d8a3c;
    --red-soft: #ffecea;
    --red-strong: #c4402f;

    --radius-card: 20px;
    --radius-control: 12px;
    --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.06);
    --shadow-focus: 0 0 0 3px rgba(91, 108, 255, 0.15);

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    /* Three sizes, no more: title for headings and the funnel counts, body for
       everything readable, caption for labels, badges and axes. */
    --fs-title: 16px;
    --fs-body: 12px;
    --fs-caption: 10px;

    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    --bar-area-h: 48px;  /* histogram plotting-area height; JS reads this for bar/goal px math */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: var(--fs-body); line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    /* Fixed app shell: the page itself never scrolls — only the two columns do.
       Height is tied to the viewport directly (100dvh, vh fallback) so it never
       depends on an ancestor's resolved height. */
    height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  header {
    padding: var(--space-4) var(--space-5) var(--space-3);
    display: flex; align-items: center; gap: var(--space-4); flex: 0 0 auto;
  }
  header h1 { font-size: var(--fs-title); margin: 0; font-weight: 700; }
  header .header-actions {
    margin-left: auto; display: flex; align-items: center; gap: var(--space-3);
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: var(--space-5);
  }
  .card-cap {
    font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-soft); margin-bottom: var(--space-4);
  }

  /* ---- App layout ----
     Six columns so halves land on a column boundary: with three, two half-width
     cards would have to share the middle column and overlap.
     The last row takes the remaining height (minmax(0,1fr) lets it shrink below
     its content) so its cards scroll internally instead of the page. */
  .layout {
    flex: 1 1 auto; min-height: 0;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr);
    gap: var(--space-5);
    padding: 0 var(--space-5) var(--space-5);
  }
  /* Row 1: funnel left, daily bars right.
     Row 2: table, joined by the detail card when a row is open. */
  .panel-funnel   { grid-column: 1 / span 3;  grid-row: 1; }
  .panel-daily    { grid-column: 4 / -1;      grid-row: 1; }

  .card-table {
    grid-row: 2; grid-column: 1 / -1;
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0; padding: 0; overflow: hidden;
  }

  /* Detail opens as a modal over the page: a dimmed backdrop plus a centred
     panel that scrolls internally, so a long record never scrolls the page
     behind it. */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: var(--space-5);
    background: rgba(29, 29, 31, 0.35);
    animation: overlay-in .12s ease-out;
  }
  .modal-overlay[hidden] { display: none; }
  @keyframes overlay-in { from { opacity: 0 } to { opacity: 1 } }
  .detail-card {
    width: min(780px, 100%); max-height: 100%;
    overflow-y: auto;
    animation: panel-in .14s ease-out;
  }
  @keyframes panel-in {
    from { opacity: 0; transform: translateY(6px) }
    to   { opacity: 1; transform: none }
  }

  /* Controls row: filters left, search right — pinned on top of the left card */
  .controls {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-5) var(--space-5) var(--space-4);
    flex-wrap: wrap; flex: 0 0 auto;
  }
  .controls .search-wrap { margin-left: auto; }
  .search-wrap { position: relative; display: inline-flex; align-items: center; }
  .search-wrap input {
    background: var(--surface); border: 1px solid var(--track); color: var(--text);
    border-radius: var(--radius-control); padding: 7px var(--space-3);
    min-width: 200px; padding-right: 30px;
    font-family: inherit; font-size: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search-wrap input:hover { border-color: var(--text-faint); }
  .search-wrap input:focus-visible {
    outline: none; border-color: var(--accent); box-shadow: var(--shadow-focus);
  }
  .search-clear {
    position: absolute; right: var(--space-2); top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-faint); cursor: pointer;
    font-size: var(--fs-title); line-height: 1; padding: 2px 4px; border-radius: 4px;
    display: none; transition: color .12s, background .12s;
  }
  .search-clear:hover { color: var(--text); background: var(--surface-soft); }
  .search-wrap.has-value .search-clear { display: block; }

  /* Filters — compact clickable pills (one line: label + count) */
  .metrics { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
  .metric {
    display: inline-flex; align-items: center; gap: var(--space-2);
    background: var(--surface); border: 1px solid var(--track); border-radius: 999px;
    padding: 5px var(--space-3); cursor: pointer; user-select: none;
    transition: border-color .12s, background .12s, opacity .12s;
  }
  .metric:hover { border-color: var(--text-faint); }
  .metric.active { border-color: var(--accent); background: var(--accent-soft); }
  .metric.zero { opacity: .45; }
  .metric.zero.active { opacity: 1; }
  .metric .lbl {
    font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-soft);
  }
  .metric.active .lbl { color: var(--accent); }
  .metric .num { font-size: var(--fs-body); font-weight: 700; line-height: 1; }
  .metric.m-all .num { color: var(--text); }
  .metric.m-applied .num { color: var(--text-soft); }
  .metric.m-active .num { color: var(--green-strong); }
  .metric.m-offers .num { color: var(--accent); }
  .metric.m-rejected .num { color: var(--red-strong); }

  /* Charts: the right column is only half the screen wide, and side-by-side
     clips the 5-stage funnel, so bars and funnel are separate stacked cards. */
  .panel-funnel > #funnelStepped { display: flex; flex-direction: column; }

  /* Daily-applied histogram */
  .daily-head { display: flex; align-items: baseline; gap: 0; margin-bottom: var(--space-3); flex-wrap: wrap; }
  .daily-head .big { font-size: var(--fs-body); font-weight: 600; color: var(--text); line-height: 1; }
  .daily-head .big .unit { font-size: var(--fs-caption); font-weight: 500; color: var(--text-soft); margin-left: var(--space-1); }
  .daily-head .sub { font-size: var(--fs-caption); color: var(--text-soft); }
  .daily-head .sub b { color: var(--text); font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 4px; position: relative; }
  /* Dashed goal line overlaid on the histogram, on the same px axis as the bars
     (bottom offset = target/peak * AREA_H, matching the JS). */
  .goal-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--green-strong); pointer-events: none; z-index: 2; }
  .goal-lbl { position: absolute; left: 0; top: -7px; font-size: var(--fs-caption); line-height: 1; color: #fff; background: var(--green-strong); padding: 1px 5px 2px; border-radius: 4px; }
  .bar-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  /* Fixed-height plotting area so bar px heights stay proportional (JS reads --bar-area-h). */
  .bar-area { width: 100%; height: var(--bar-area-h); display: flex; align-items: flex-end; position: relative; }
  .bar { width: 100%; border-radius: 4px 4px 0 0; background: #cdd2f5; transition: height .25s; }
  .bar.zero { background: var(--track); }
  .bar-col.is-today .bar { background: var(--accent); }
  .bar-col.is-weekend .bar { opacity: .55; }
  /* Count sits absolutely over the bar area, out of layout flow so it never adds
     height. May overlap or be covered by the bar; that's fine. */
  .bar-n { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: var(--fs-caption); font-weight: 600; color: var(--text); line-height: 1; pointer-events: none; z-index: 1; }
  .bar-n.is-zero { color: var(--text-faint); font-weight: 400; }
  .bar-x { display: flex; gap: 4px; margin-top: 6px; }
  .bx { flex: 1 1 0; text-align: center; font-size: var(--fs-caption); color: var(--text-soft); line-height: 1.2; }
  .bx.is-today { color: var(--accent); font-weight: 700; }
  .bx .wd { display: block; }
  .bx .dm { display: block; opacity: .7; }

  /* Funnel — five stage cards in a row. Each carries its count and the
     conversion from the previous stage, shown as a horizontal progress bar at
     the bottom: fill width = conv%, color encodes transition quality
     (green >40, amber 20–40, red <20). */
  .steps { width: 100%; display: flex; flex-direction: row; gap: var(--space-2); align-items: stretch; }
  .step-col {
    position: relative; flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; gap: var(--space-1);
    padding: var(--space-3) var(--space-3) var(--space-4);
    background: var(--surface-soft); border: 1px solid var(--track);
    border-radius: var(--radius-control);
  }
  .step-col.is-empty { opacity: .55; }
  .step-name {
    font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .step-count { font-size: var(--fs-title); font-weight: 700; color: var(--text); line-height: 1.1; }
  .step-meta { font-size: var(--fs-caption); color: var(--text-soft); }
  .step-bar { display: block; margin-top: auto; width: 100%; height: 6px;
    background: var(--track); border-radius: 3px; overflow: hidden; }
  .step-bar-fill { display: block; height: 100%; border-radius: 3px; transition: width .25s; }
  .step-bar-fill.q-green { background: var(--green); }
  .step-bar-fill.q-amber { background: var(--warn); }
  .step-bar-fill.q-red   { background: var(--red); }

  /* Scrolling row list: the only thing that scrolls in the left column. */
  #tableWrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 var(--space-5) var(--space-5); }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-soft); padding: var(--space-2) var(--space-3);
    border-bottom: 1px solid var(--track); white-space: nowrap;
    /* Stick the header to the top of the scrolling list. */
    position: sticky; top: 0; background: var(--surface); z-index: 3;
  }
  tbody tr { border-bottom: 1px solid var(--track); cursor: pointer; transition: background .12s; }
  tbody tr:hover { background: var(--surface-soft); }
  tbody tr.is-selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  tbody td { padding: var(--space-2) var(--space-3); vertical-align: middle; }
  .company-role { line-height: 1.25; }
  .cr-company { font-weight: 600; color: var(--text); }
  .cr-role { font-size: var(--fs-caption); color: var(--text-soft); margin-top: 2px; }
  /* Stack chips: outlined, wrapping within the cell. */
  .stack-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    display: inline-block; padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--track); background: var(--surface-soft);
    color: var(--text-soft); font-size: var(--fs-caption); white-space: nowrap;
  }
  .chip-more { color: var(--text-faint); }
  /* Salary: single normalized €/mo figure; original lives in the detail card. */
  .sal-primary { color: var(--text); }
  /* Seniority: short enum, never wraps, stays a narrow column next to the wider ones. */
  .seniority { white-space: nowrap; }
  /* Last contact: days-since on top (amber when stale), exact date muted below. */
  .lastcontact { line-height: 1.25; }
  .lc-date { font-size: var(--fs-caption); color: var(--text-soft); margin-top: 2px; }
  .status-pipeline { white-space: nowrap; }
  .muted { color: var(--text-faint); }
  .badge { display: inline-block; padding: 2px var(--space-2); border-radius: 6px; font-size: var(--fs-caption); font-weight: 500; }
  .st-applied  { background: var(--track); color: var(--text-soft); }
  .st-active   { background: var(--green-soft); color: var(--green-strong); }
  .st-offer    { background: var(--accent-soft); color: var(--accent); }
  .st-rejected { background: var(--red-soft); color: var(--red-strong); }
  .st-withdrawn{ background: var(--track); color: var(--text-soft); }

  /* Dual badge: one outline in the status color; left half filled (status),
     right half outline-only (pipeline). --st-* is set inline per status. */
  .dual { display: inline-flex; align-items: stretch; border: 1px solid var(--st-bg); border-radius: 6px; overflow: hidden; font-size: var(--fs-caption); vertical-align: middle; }
  .dual .d-status { display: inline-flex; align-items: center; padding: 2px var(--space-2); font-weight: 500; background: var(--st-bg); color: var(--st-color); }
  .dual .d-pipe { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 2px var(--space-2); color: var(--text); }
  .dual .d-pipe .empty { color: var(--text-faint); font-style: italic; }
  /* Pipeline stages: plain text + colored dot, joined by arrows. */
  .stage { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .stage .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.passed { background: var(--green); }
  .dot.failed { background: var(--red); }
  .dot.pending { background: var(--text-faint); }
  .dot.upcoming { background: var(--accent); box-shadow: 0 0 0 0 rgba(91,108,255,.7); animation: pulse 1.6s infinite; }
  .stage.is-upcoming { color: var(--accent); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(91,108,255,.6); }
    70% { box-shadow: 0 0 0 6px rgba(91,108,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(91,108,255,0); }
  }
  .arrow { color: var(--text-faint); }
  .empty { color: var(--text-faint); font-style: italic; }

  /* Detail modal head: title block left, status badge top-right on the title's line. */
  .detail-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: var(--space-4); margin-bottom: var(--space-4);
  }
  .detail-head h2 { margin: 0 0 var(--space-1); font-size: var(--fs-title); font-weight: 600; line-height: 1.3; }
  .detail-head .sub { color: var(--text-soft); }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px var(--space-4); margin-bottom: var(--space-5); }
  .kv dt { color: var(--text-soft); }
  .kv dd { margin: 0; }

  /* Tab bar */
  .tab-bar {
    display: flex; gap: 0; flex-wrap: wrap;
    border-bottom: 1px solid var(--track);
    margin-bottom: var(--space-4);
  }
  .tab-btn {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--text-soft); font-family: inherit; font-size: var(--fs-body);
    padding: var(--space-2) var(--space-3); cursor: pointer;
    margin-bottom: -1px; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color .12s, border-color .12s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .detail-card a { color: var(--accent); text-decoration: none; }
  .detail-card a:hover { text-decoration: underline; }
  /* A stage's `###` headings arrive here as h5. At body size and bold they were
     indistinguishable from the `**Angular core**` labels that group the tables
     under them, flattening the one hierarchy the tab has — so they take the
     same uppercase caption treatment as every other section label on the page. */
  .detail-card .md-body h3, .detail-card .md-body h4, .detail-card .md-body h5, .detail-card .md-body h6 {
    margin: var(--space-5) 0 var(--space-2); font-size: var(--fs-caption);
    text-transform: uppercase; letter-spacing: .04em; color: var(--text-soft);
  }
  .detail-card .md-body > :first-child { margin-top: 0; }
  .detail-card .md-body p { margin: 6px 0; }
  .detail-card .md-body ul.md { margin: 6px 0; padding-left: 20px; }
  .detail-card .md-body code { background: var(--surface-soft); border: 1px solid var(--track); padding: 1px 5px; border-radius: 4px; font-size: var(--fs-caption); }
  /* Question tables: the Result column is a single glyph, the Note column
     carries the prose, so only Note is allowed to take the leftover width. */
  .detail-card .md-body table.md { width: 100%; border-collapse: collapse; margin: var(--space-3) 0; font-size: var(--fs-caption); table-layout: auto; }
  .detail-card .md-body table.md th { text-align: left; font-weight: 600; color: var(--text-soft); border-bottom: 1px solid var(--track); padding: var(--space-2) var(--space-3) var(--space-2) 0; white-space: nowrap; }
  .detail-card .md-body table.md td { vertical-align: top; border-bottom: 1px solid var(--track); padding: var(--space-2) var(--space-3) var(--space-2) 0; }
  .detail-card .md-body table.md tr:last-child td { border-bottom: none; }
  /* Score is the last column and one digit wide; `width: 1%` under auto layout
     collapses it to its content so the question text keeps the rest. */
  .detail-card .md-body table.md th:last-child,
  .detail-card .md-body table.md td:last-child { text-align: right; white-space: nowrap; width: 1%; }

  .btn {
    background: var(--surface); border: 1px solid var(--track); color: var(--text-soft);
    cursor: pointer; border-radius: var(--radius-control);
    transition: color .12s, border-color .12s, background .12s;
  }
  .btn:hover { color: var(--text); border-color: var(--text-faint); background: var(--surface-soft); }
  .btn-icon { padding: 5px var(--space-2); display: flex; align-items: center; }
  .btn-icon.is-on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .data-error { color: var(--red-strong); font-size: var(--fs-caption); }

  .empty-state { padding: 48px 28px; text-align: center; color: var(--text-soft); }
  .empty-state p { margin: var(--space-2) 0; }

  /* Narrow screens: one column, the page scrolls instead of each card. The
     explicit grid-column/row assignments have to be undone, or the cards keep
     their three-column placement on a one-column grid. */
  @media (max-width: 1000px) {
    body { height: auto; overflow: auto; }
    .layout { grid-template-columns: 1fr; grid-template-rows: none; }
    .layout > * { grid-column: 1 !important; grid-row: auto !important; }
    #tableWrap { max-height: 60vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Career dashboard</h1>
  <div class="header-actions">
    <span id="dataError" class="data-error"></span>
    <button class="btn btn-icon" id="incognitoBtn" title="Hide salaries">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="11" r="3"/>
        <circle cx="14" cy="11" r="3"/>
        <path d="M3 11 C3 8 5 7 6 7"/>
        <path d="M9 9 C9 8.5 9.5 8 10 8 C10.5 8 11 8.5 11 9"/>
        <path d="M17 11 C17 8 15 7 14 7"/>
      </svg>
    </button>
  </div>
</header>

<div class="layout" id="layout">
  <!-- Row 1: funnel left, daily bars right -->
  <div class="card panel-funnel">
    <div class="card-cap">Pipeline funnel</div>
    <div id="funnelStepped"></div>
  </div>
  <div class="card panel-daily">
    <div class="card-cap">Applied per day</div>
    <div id="dailyChart"></div>
  </div>

  <!-- Row 2: filters + search pinned on top, scrolling table below -->
  <div class="card card-table">
    <div class="controls">
      <div class="metrics" id="metrics"></div>
      <span class="search-wrap" id="searchWrap">
        <input id="search" type="text" placeholder="Search company, role, stack…">
        <button class="search-clear" id="searchClear" type="button" title="Clear search" aria-label="Clear search">×</button>
      </span>
    </div>
    <div id="tableWrap"></div>
  </div>
</div>

<!-- Detail modal, outside the grid: a click on the backdrop closes it -->
<div class="modal-overlay" id="detailOverlay" hidden>
  <div class="card detail-card" id="detail" role="dialog" aria-modal="true"></div>
</div>

<script>
let PAYLOAD, DATA, TODAY;

// ---- Date utilities -------------------------------------------------------

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// Returns isoB - isoA in days (positive when B is later than A).
// Parses each string by splitting — never uses new Date(str) to avoid UTC drift.
function daysBetween(isoA, isoB) {
  const [ay, am, ad] = isoA.split("-").map(Number);
  const [by, bm, bd] = isoB.split("-").map(Number);
  const a = Date.UTC(ay, am - 1, ad);
  const b = Date.UTC(by, bm - 1, bd);
  return Math.round((b - a) / 86400000);
}

// ---- Derive layer (ported from Python 1:1) --------------------------------

function lastContact(stages, applied_date) {
  const dates = stages.map(s => s.date).filter(Boolean);
  return dates.length ? dates.reduce((a, b) => a > b ? a : b) : (applied_date || null);
}

function daysSince(lastISO, today) {
  return lastISO ? daysBetween(lastISO, today) : null;
}

function deriveApp(raw, today) {
  const last_contact = lastContact(raw.stages, raw.applied_date);
  const days_since_contact = daysSince(last_contact, today);
  return { ...raw, last_contact, days_since_contact };
}

function computeMetrics(apps) {
  return {
    all: apps.length,
    applied: apps.filter(a => a.applied).length,
    active: apps.filter(a => a.status === "active").length,
    offers: apps.filter(a => a.status === "offer").length,
    rejected: apps.filter(a => a.status === "rejected").length,
  };
}

function computeFunnel(apps, phases) {
  const n = apps.length;
  const counts = phases.map((phase, i) => {
    if (phase === "Applied") return n;
    if (phase === "Offer") return apps.filter(a => a.status === "offer").length;
    return apps.filter(a => a.reached >= i).length;
  });
  return phases.map((phase, i) => {
    const prev = i === 0 ? counts[0] : counts[i - 1];
    const conv = prev ? Math.round(100 * counts[i] / prev) : 0;
    return { phase, count: counts[i], conv };
  });
}

function computeDaily(apps, today, window, target) {
  const counts = {};
  for (const a of apps) {
    const d = (a.applied_date || "").slice(0, 10);
    if (d) counts[d] = (counts[d] || 0) + 1;
  }

  const [ty, tm, td] = today.split("-").map(Number);
  const todayUTC = Date.UTC(ty, tm - 1, td);

  const days = [];
  for (let i = window - 1; i >= 0; i--) {
    const dayUTC = todayUTC - i * 86400000;
    const dt = new Date(dayUTC);
    // Build YYYY-MM-DD from UTC parts (we computed via UTC so these are exact)
    const y = dt.getUTCFullYear();
    const mo = String(dt.getUTCMonth() + 1).padStart(2, "0");
    const da = String(dt.getUTCDate()).padStart(2, "0");
    const iso = `${y}-${mo}-${da}`;
    // weekday: use toLocaleDateString for "Mon".."Sun"
    const weekday = dt.toLocaleDateString("en-US", { weekday: "short" });
    const dom = dt.getUTCDate();
    days.push({ date: iso, count: counts[iso] || 0, weekday, dom });
  }

  const total = days.reduce((s, d) => s + d.count, 0);
  const boundary7 = new Date(todayUTC - 7 * 86400000);
  const b7y = boundary7.getUTCFullYear();
  const b7m = String(boundary7.getUTCMonth() + 1).padStart(2, "0");
  const b7d = String(boundary7.getUTCDate()).padStart(2, "0");
  const iso7 = `${b7y}-${b7m}-${b7d}`;
  const last7 = days.filter(d => d.date > iso7).reduce((s, d) => s + d.count, 0);
  const avg = window ? Math.round(total / window * 10) / 10 : 0;
  const max = days.reduce((m, d) => Math.max(m, d.count), 0);

  return { days, today: counts[today] || 0, last7, avg, max, target };
}

function derive(raw, today) {
  const apps = raw.apps.map(a => deriveApp(a, today));
  const metrics = computeMetrics(apps);
  const funnel = computeFunnel(apps, raw.phases);
  const daily = computeDaily(apps, today, raw.daily_window, raw.daily_target);
  return { apps, metrics, funnel, daily };
}

// ---- Boot -----------------------------------------------------------------

const LS_KEY = "careerDashboardData";

// Same origin as the page: the Worker serves both this file and the payload,
// so there is nothing to configure per device.
const FEED = "/payload.json";

function validate(raw) {
  return raw && Array.isArray(raw.apps) && Array.isArray(raw.phases);
}

async function loadFromSource(src) {
  const bust = src + (src.includes("?") ? "&" : "?") + "t=" + Date.now();
  const res = await fetch(bust, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const raw = await res.json();
  if (!validate(raw)) throw new Error("unrecognised format");
  localStorage.setItem(LS_KEY, JSON.stringify(raw));
  return raw;
}

function boot(raw) {
  // derive() builds new objects, so any open detail still points into the
  // previous array: its row loses selection and DATA.indexOf() returns -1,
  // making the next click read DATA[-1]. Close it before swapping.
  clearDetail();
  TODAY = todayISO();
  PAYLOAD = derive(raw, TODAY);
  DATA = PAYLOAD.apps;
  renderMetrics(); renderDailyChart(); renderSteppedFunnel(); render();
}

function showEmptyState(msg) {
  document.getElementById("tableWrap").innerHTML =
    `<div class="empty-state"><p>${msg}</p><p>Run <code>python3 src/generate.py &amp;&amp; ./src/deploy-data.sh</code> to publish the feed.</p></div>`;
}

// Quotes included: esc() is interpolated into href="" and title="" attributes,
// where an unescaped quote in a company name or source URL escapes the attribute.
const esc = s => (s ?? "").toString()
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");

let incognito = localStorage.getItem('incognito') === '1';
let openApp = null;

function statusBadge(s) { return `<span class="badge st-${esc(s)}">${esc(s)}</span>`; }

// Table salary: strip "K" and "/mo" to a bare €-figure. "€4.5K/mo" → "€4500",
// "€1K/mo" → "€1000", "€10.7K/mo" → "€10700". Falls back to the raw string if
// it doesn't match the expected shape.
function salaryShort(s) {
  if (!s) return "";
  const m = s.match(/€\s*([\d.]+)\s*K/i);
  if (!m) return s;
  return "€" + Math.round(parseFloat(m[1]) * 1000).toLocaleString("en-US");
}

// Text + fill per status (mirrors the .st-* CSS), for the dual badge.
const ST_COLORS = {
  applied:   { color: "#6e6e73", bg: "#eceef1" },
  active:    { color: "#1d8a3c", bg: "#e6f7ea" },
  offer:     { color: "#5b6cff", bg: "#eef0ff" },
  rejected:  { color: "#c4402f", bg: "#ffecea" },
  withdrawn: { color: "#6e6e73", bg: "#eceef1" },
};

// One outlined badge in the status color: left = filled status, right = pipeline (outline only).
function dualBadge(status, stages) {
  const c = ST_COLORS[status] || ST_COLORS.applied;
  const pipe = stages.length
    ? stages.map((s, i) => {
        const cls = stageClass(s);
        const arrow = i ? `<span class="arrow">›</span>` : "";
        const up = cls === "upcoming" ? " is-upcoming" : "";
        const resTxt = cls === "upcoming" ? "upcoming " + s.date : (s.result || "pending");
        return `${arrow}<span class="stage${up}" title="${esc(s.stage)} · ${esc(s.phase)} — ${esc(resTxt)}"><span class="dot ${cls}"></span>${esc(s.short)}</span>`;
      }).join("")
    : `<span class="empty">—</span>`;
  return `<span class="dual" style="--st-color:${c.color};--st-bg:${c.bg}">`
       + `<span class="d-status">${esc(status)}</span>`
       + `<span class="d-pipe">${pipe}</span>`
       + `</span>`;
}

function stageClass(s) {
  const r = (s.result || "").toLowerCase();
  if (r.startsWith("pass")) return "passed";
  if (r.startsWith("fail")) return "failed";
  if (r.startsWith("sched")) return "upcoming";
  return "pending";
}

// ---- Filter cards (the only filter UI; clicking a card filters the table) ----
// Each card carries its own predicate + which metric count to show.
const FILTERS = [
  { key: "all",      label: "All",      cls: "m-all",      metric: "all",      test: () => true },
  { key: "applied",  label: "Applied",  cls: "m-applied",  metric: "applied",  test: a => a.applied },
  { key: "active",   label: "Active",   cls: "m-active",   metric: "active",   test: a => a.status === "active" },
  { key: "offer",    label: "Offers",   cls: "m-offers",   metric: "offers",   test: a => a.status === "offer" },
  { key: "rejected", label: "Rejected", cls: "m-rejected", metric: "rejected", test: a => a.status === "rejected" },
];
let activeFilter = "all";
let searchQuery = "";

// ---- Metric cards (double as filter controls) ----
function renderMetrics() {
  const m = PAYLOAD.metrics;
  document.getElementById("metrics").innerHTML = FILTERS.map(f => {
    const n = m[f.metric] ?? 0;
    const zero = (n === 0 && f.key !== "all") ? " zero" : "";
    return `<div class="metric ${f.cls}${zero} ${activeFilter === f.key ? "active" : ""}" data-filter="${f.key}">
       <span class="lbl">${esc(f.label)}</span><span class="num">${n}</span></div>`;
  }).join("");
}

// ---- Daily-applied histogram ----
function renderDailyChart() {
  const d = PAYLOAD.daily;

  // Bars scale to the busiest day OR the goal, whichever is taller, so the goal
  // line is always on-scale even on days nobody reached it (min 1 to avoid /0).
  // Heights are absolute px against a fixed-height area (AREA_H) — NOT % of the
  // flex parent, whose height is content-dependent and collapses 4 vs 3 to the
  // same pixels. px on a fixed axis keeps counts proportional and lets the goal
  // line land exactly where a bar of `target` height tops out.
  // Single source of truth for the plotting-area height: the --bar-area-h CSS var.
  const AREA_H = parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue("--bar-area-h"), 10) || 64;
  const target = d.target || 0;
  const peak = Math.max(d.max, target, 1);
  const bars = d.days.map(day => {
    const isToday = day.date === TODAY;
    const wd = day.weekday;
    const weekend = (wd === "Sat" || wd === "Sun");
    const hPx = day.count > 0 ? Math.max(2, Math.round(day.count / peak * AREA_H)) : 0;
    const colCls = (isToday ? " is-today" : "") + (weekend ? " is-weekend" : "");
    return `<div class="bar-col${colCls}" title="${esc(day.date)} (${esc(wd)}): ${day.count} applied">
        <div class="bar-area">
          <div class="bar${day.count === 0 ? " zero" : ""}" style="height:${hPx}px"></div>
          <span class="bar-n${day.count === 0 ? " is-zero" : ""}">${day.count || ""}</span>
        </div>
      </div>`;
  }).join("");

  // Dashed goal line on the same px axis: a bar of `target` count tops out here.
  const goalPx = target > 0 ? Math.round(target / peak * AREA_H) : 0;
  const goalLine = target > 0
    ? `<div class="goal-line" style="bottom:${goalPx}px"><span class="goal-lbl">goal ${target}/day</span></div>`
    : "";

  const axis = d.days.map(day => {
    const isToday = day.date === TODAY;
    return `<div class="bx${isToday ? " is-today" : ""}">
        <span class="wd">${esc(day.weekday)}</span><span class="dm">${day.dom}</span>
      </div>`;
  }).join("");

  document.getElementById("dailyChart").innerHTML = `
    <div class="daily-head">
      <span class="big">${d.today}<span class="unit">today</span></span>
      <span class="sub">&nbsp;· <b>${d.last7}</b> last 7d · avg <b>${d.avg}</b>/day</span>
    </div>
    <div class="bars">${goalLine}${bars}</div>
    <div class="bar-x">${axis}</div>`;
}

// ---- Funnel — five stage cards, each with a conversion bar ----
// conv = % flowing in from the PREVIOUS stage. Color encodes transition
// quality: green >40, amber 20–40 (inclusive), red <20. The first card
// (Applied) has no inbound transition, so it shows the total with no quality color.
function convQuality(conv) {
  if (conv > 40) return "q-green";
  if (conv >= 20) return "q-amber";
  return "q-red";
}

function renderSteppedFunnel() {
  const data = PAYLOAD.funnel;

  const cols = data.map((f, i) => {
    const emptyCls = f.count === 0 ? " is-empty" : "";

    // First stage: no inbound transition — plain total, no bar.
    if (i === 0) {
      return `<div class="step-col${emptyCls}">
        <span class="step-name">${esc(f.phase)}</span>
        <span class="step-count">${f.count}</span>
        <span class="step-meta">total applied</span>
      </div>`;
    }

    const q = convQuality(f.conv);
    const drop = data[i - 1].count - f.count;
    const dropHtml = drop > 0
      ? `<span style="color:var(--red-strong)">−${drop} dropped</span>`
      : `no drop`;
    const barW = Math.max(0, Math.min(100, f.conv));  // clamp to 0–100%

    return `<div class="step-col${emptyCls}">
      <span class="step-name">${esc(f.phase)}</span>
      <span class="step-count">${f.count}</span>
      <span class="step-meta">${f.conv}% conversion<br>${dropHtml}</span>
      <span class="step-bar"><span class="step-bar-fill ${q}" style="width:${barW}%"></span></span>
    </div>`;
  }).join("");

  document.getElementById("funnelStepped").innerHTML = `<div class="steps">${cols}</div>`;
}

// ---- Table ----

// Stacks run up to six entries; showing them all would set the column's width
// off the longest one. First three as chips, the rest as +N with the full list
// on hover.
const STACK_SHOWN = 3;

function stackCell(stack) {
  const all = stack || [];
  if (!all.length) return '<span class="muted">—</span>';
  const chips = all.slice(0, STACK_SHOWN)
    .map(s => `<span class="chip">${esc(s)}</span>`).join("");
  const rest = all.length - STACK_SHOWN;
  const more = rest > 0 ? `<span class="chip chip-more">+${rest}</span>` : "";
  return `<span class="stack-chips" title="${esc(all.join(", "))}">${chips}${more}</span>`;
}

function rowHtml(a) {
  const rowCls = a === openApp ? "is-selected" : "";
  return `
    <tr data-i="${DATA.indexOf(a)}" class="${rowCls}">
      <td class="company-role">
        <div class="cr-company">${esc(a.company)}</div>
        <div class="cr-role">${esc(a.role) || "—"}</div>
      </td>
      <td class="status-pipeline">${dualBadge(a.status, a.stages)}</td>
      <td class="lastcontact">${a.last_contact ? `${a.days_since_contact != null ? `<div class="lc-days" style="color:${a.days_since_contact >= 14 ? 'var(--warn-strong)' : 'var(--text)'}">${a.days_since_contact}д</div>` : ""}<div class="lc-date">${esc(a.last_contact)}</div>` : '<span class="muted">—</span>'}</td>
      <td class="salary">${incognito ? '<span class="muted">—</span>' : (a.salary_primary ? `<div class="sal-primary">${esc(salaryShort(a.salary_primary))}</div>` : '<span class="muted">—</span>')}</td>
      <td class="seniority">${a.seniority ? esc(a.seniority) : '<span class="muted">—</span>'}</td>
      <td class="stack">${stackCell(a.stack_all)}</td>
    </tr>`;
}

function render() {
  const q = searchQuery.toLowerCase().trim();
  const f = FILTERS.find(x => x.key === activeFilter) || FILTERS[0];
  const match = a => !q || [a.company, a.role, a.stack_main, (a.stack_all||[]).join(" "), a.location]
    .join(" ").toLowerCase().includes(q);

  let rows = DATA.filter(a => f.test(a) && match(a));
  rows.sort((x, y) => (y.applied_date || "").localeCompare(x.applied_date || ""));

  const body = rows.length
    ? `<table>
        <thead><tr>
          <th>Company / Role</th><th>Pipeline / Status</th><th>Last contact</th><th>Salary asked</th><th>Seniority</th><th>Stack</th>
        </tr></thead>
        <tbody>${rows.map(rowHtml).join("")}</tbody>
      </table>`
    : `<p class="empty" style="padding:20px 4px">No matches.</p>`;
  document.getElementById("tableWrap").innerHTML = body;
}

function setFilter(key) {
  if (!FILTERS.some(f => f.key === key)) return;
  activeFilter = key;
  renderMetrics(); render();
}

function openDetail(a) {
  openApp = a;

  // Highlight the selected row in the table.
  const i = DATA.indexOf(a);
  document.querySelectorAll("#tableWrap tbody tr").forEach(tr => {
    tr.classList.toggle("is-selected", +tr.dataset.i === i);
  });

  // --- Tab buttons: one per section (Decision log, ...), then one per stage ---
  const tabBtns = a.sections.map((sec, i) =>
    `<button class="tab-btn${i === 0 ? " active" : ""}" data-tab="${i}">${esc(sec.label)}</button>`
  );
  a.stages.forEach((s, i) => {
    const cls = stageClass(s);
    tabBtns.push(
      `<button class="tab-btn" data-tab="${a.sections.length + i}"><span class="dot ${cls}"></span>${esc(s.short || s.stage)}</button>`
    );
  });

  // --- Metadata block: pinned above the tab bar, so it stays visible across tabs ---
  const metaBlock = `<dl class="kv">
      <dt>Stack</dt><dd>${esc((a.stack_all||[]).join(", ")) || "—"}</dd>
      <dt>Salary asked</dt><dd>${incognito ? "—" : (a.salary_primary ? esc(a.salary_primary) + (a.salary_original ? ` · ${esc(a.salary_original)}` : "") : "—")}</dd>
      ${!incognito && a.salary_note ? `<dt>Salary note</dt><dd>${esc(a.salary_note)}</dd>` : ""}
      ${a.fit_score ? `<dt>Fit</dt><dd>${incognito ? "—" : `${esc(a.fit_score)}/10${a.fit_note ? ` · ${esc(a.fit_note)}` : ""}`}</dd>` : ""}
      <dt>Source</dt><dd>${a.source ? (/^https?:\/\//.test(a.source) ? `<a href="${esc(a.source)}" target="_blank" rel="noopener">${esc(a.source)}</a>` : esc(a.source)) : "—"}</dd>
      <dt>Applied</dt><dd>${esc(a.applied_date) || "—"}</dd>
      <dt>Last contact</dt><dd>${a.last_contact ? `${esc(a.last_contact)}${a.days_since_contact != null ? ` · ${a.days_since_contact}д` : ""}` : "—"}</dd>
      ${a.closed_date ? `<dt>Closed</dt><dd>${esc(a.closed_date)}</dd>` : ""}
    </dl>`;

  // --- Section panels (Decision log, ...) ---
  const sectionPanels = a.sections.map((sec, i) =>
    `<div class="tab-panel${i === 0 ? " active" : ""}" data-panel="${i}">
      <div class="md-body">${sec.html || "<p class=\"empty\">No content.</p>"}</div>
    </div>`
  ).join("");

  // --- Stage panels ---
  const stagePanels = a.stages.map((s, i) =>
    `<div class="tab-panel" data-panel="${a.sections.length + i}">
      <div class="md-body">${s.body_html || "<p class=\"empty\">No content.</p>"}</div>
    </div>`
  ).join("");

  // Seniority and location share the title's sub-line; the status badge moved
  // to the top-right corner, so neither item can assume a badge precedes it.
  const subLine = [a.seniority, a.location].filter(Boolean).map(esc).join(" · ");

  const detail = document.getElementById("detail");
  detail.innerHTML = `
    <div class="detail-head">
      <div>
        <h2>${esc(a.company)} — ${esc(a.role)}</h2>
        <div class="sub">${subLine}</div>
      </div>
      ${statusBadge(a.status)}
    </div>
    ${metaBlock}
    <div class="tab-bar">${tabBtns.join("")}</div>
    ${sectionPanels}
    ${stagePanels}`;

  // Tab switching logic
  detail.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = btn.dataset.tab;
      detail.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      detail.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      detail.querySelector(`.tab-panel[data-panel="${idx}"]`).classList.add("active");
    });
  });

  document.getElementById("detailOverlay").hidden = false;
  detail.scrollTop = 0;
}

// #metrics is re-rendered wholesale, so delegate clicks from a stable parent.
document.getElementById("metrics").addEventListener("click", e => {
  const c = e.target.closest(".metric"); if (c) setFilter(c.dataset.filter);
});
document.getElementById("tableWrap").addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  openDetail(DATA[+tr.dataset.i]);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") clearDetail(); });
// Backdrop click closes; clicks inside the panel must not, so match the overlay
// itself rather than any descendant.
document.getElementById("detailOverlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) clearDetail();
});

function clearDetail() {
  openApp = null;
  document.querySelectorAll("#tableWrap tbody tr.is-selected")
    .forEach(tr => tr.classList.remove("is-selected"));
  document.getElementById("detailOverlay").hidden = true;
  document.getElementById("detail").innerHTML = "";
}
const searchInput = document.getElementById("search");
const searchWrap = document.getElementById("searchWrap");
const searchClear = document.getElementById("searchClear");
function syncSearchClear() {
  searchWrap.classList.toggle("has-value", searchInput.value.length > 0);
}
searchInput.addEventListener("input", e => {
  searchQuery = e.target.value; syncSearchClear(); render();
});
searchClear.addEventListener("click", () => {
  searchInput.value = ""; searchQuery = ""; syncSearchClear(); render(); searchInput.focus();
});
syncSearchClear();

const incognitoBtn = document.getElementById("incognitoBtn");
if (incognito) incognitoBtn.classList.add("is-on");
incognitoBtn.addEventListener("click", () => {
  incognito = !incognito;
  localStorage.setItem('incognito', incognito ? '1' : '0');
  incognitoBtn.classList.toggle("is-on", incognito);
  render();
  if (openApp) openDetail(openApp);
});

// Init — render the cached copy first so the page is never blank, then refresh
// from the remote feed. A failed refresh leaves the cached view in place.
(async function init() {
  const stored = localStorage.getItem(LS_KEY);
  let shown = false;
  if (stored) {
    let raw;
    try { raw = JSON.parse(stored); } catch (_) { raw = null; }
    if (raw && validate(raw)) { boot(raw); shown = true; }
  }

  const err = document.getElementById("dataError");
  try {
    boot(await loadFromSource(FEED));
  } catch (e) {
    if (shown) {
      err.textContent = `Showing cached data — refresh failed (${e.message}).`;
    } else {
      showEmptyState(`Could not load data (${e.message}).`);
    }
  }
})();
</script>
