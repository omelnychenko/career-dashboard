name = "career"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Everything in app/ is public; the Worker answers /payload.json itself. This
# directory is the entire published surface — a file moved out of it stops being
# reachable, and one moved in starts being served without any code path.
[assets]
directory = "app"
binding = "ASSETS"

[[kv_namespaces]]
binding = "DATA"
id = "bb5af97b1bc54990bc525a9ecd1225aa"
